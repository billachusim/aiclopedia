name: AiClopedia
description: AI for everyone.


publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.3.0+23

environment:
  sdk: '>=3.0.2 <4.0.0'


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.2
  http: ^1.6.0
  provider: ^6.1.5
  animated_text_kit: ^4.3.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.2.0
  firebase_core: ^4.1.0
  firebase_crashlytics: ^5.0.10
  firebase_analytics: ^12.1.2
  firebase_messaging: ^16.1.2
  firebase_core_platform_interface: ^8.0.0
  google_mobile_ads: ^9.0.0
  firebase_auth: ^6.2.0
  firebase_database: ^12.1.3
  shared_preferences: ^2.5.4
  logger: ^2.6.2
  flutter_svg: ^2.2.3
  app_tracking_transparency: ^2.0.6+1
  uuid: ^4.5.2
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.2
  google_generative_ai: ^0.4.7
  google_fonts: ^8.2.0
  timeago: ^3.7.0
  rxdart: ^0.28.0
  flutter_lints: ^6.0.0
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.4.7
  get: ^4.7.3
  firebase_app_check: ^0.4.1+6
  flutter_dotenv: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4


flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/aiclop.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/aiclop.png"


flutter_native_splash:
  color: "#000000"
  image: "assets/images/aiclop.png"
  ios: true
  android: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

